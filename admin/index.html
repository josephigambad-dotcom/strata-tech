<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strata Tech — Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#0A0A0A;--bg2:#111;--bg3:#1A1A1A;--border:#242424;--border2:#2E2E2E;--fg:#F2F2F2;--fg2:#9A9A9A;--fg3:#555;--accent:#38BDF8;--accent2:#7DD3FC;--accent-dim:rgba(56,189,248,0.08);--accent-bord:rgba(56,189,248,0.22);--green:#22C55E;--red:#EF4444;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;min-height:100vh;}
/* LOGIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:48px 40px;width:100%;max-width:380px;}
.login-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--fg2);margin-bottom:8px;}
.login-logo span{color:var(--accent);}
.login-sub{font-size:13px;color:var(--fg3);margin-bottom:32px;}
.login-box label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin-bottom:6px;}
.login-box input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:11px 14px;font-family:'Inter',sans-serif;font-size:14px;color:var(--fg);outline:none;transition:border-color .15s;}
.login-box input:focus{border-color:var(--accent);}
.login-btn{margin-top:16px;width:100%;background:var(--accent);color:#000;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;padding:12px;border-radius:8px;border:none;cursor:pointer;transition:background .15s;}
.login-btn:hover{background:var(--accent2);}
.login-error{margin-top:12px;font-size:13px;color:var(--red);text-align:center;}
/* DASHBOARD */
.dashboard{display:none;min-height:100vh;flex-direction:column;}
.dashboard.visible{display:flex;}
.admin-nav{background:rgba(10,10,10,.95);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);}
.admin-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.025em;color:var(--fg2);}
.admin-logo span{color:var(--accent);}
.admin-logo small{font-size:11px;font-weight:400;color:var(--fg3);margin-left:8px;letter-spacing:.06em;text-transform:uppercase;}
.admin-nav-actions{display:flex;gap:12px;align-items:center;}
.btn-sm{font-size:12px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--fg2);cursor:pointer;transition:border-color .15s,color .15s;}
.btn-sm:hover{border-color:var(--fg3);color:var(--fg);}
.admin-body{padding:28px 24px;flex:1;max-width:1300px;width:100%;margin:0 auto;}
/* STATS */
#adminStats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;}
.stat-chip{padding:16px 20px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);min-width:110px;}
.stat-chip-val{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;line-height:1;}
.stat-chip-label{font-size:11px;color:var(--fg3);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}
/* FILTERS */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.filter-btn{font-size:12px;font-weight:500;padding:6px 14px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--fg2);cursor:pointer;transition:all .15s;}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
/* TABLE */
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:720px;}
thead th{padding:12px 16px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);text-align:left;border-bottom:1px solid var(--border);}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--bg3);}
td{padding:14px 16px;font-size:13px;vertical-align:middle;}
.loading-row{text-align:center;color:var(--fg3);padding:40px!important;}
.wa-link{color:var(--green);text-decoration:none;font-weight:500;}
.wa-link:hover{text-decoration:underline;}
.status-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px;border:1px solid;display:inline-block;}
.status-select{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--fg);font-family:'Inter',sans-serif;cursor:pointer;}
.detail-btn{font-size:12px;font-weight:600;padding:6px 12px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--fg2);cursor:pointer;transition:all .15s;white-space:nowrap;}
.detail-btn:hover{border-color:var(--accent);color:var(--accent);}
/* DEMO NOTICE */
#demoNotice{background:rgba(250,204,21,.06);border:1px solid rgba(250,204,21,.2);border-radius:8px;padding:12px 16px;font-size:13px;color:#FACC15;margin-bottom:20px;}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:36px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;position:relative;}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg3);border:1px solid var(--border);color:var(--fg2);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .15s;}
.modal-close:hover{color:var(--fg);}
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.detail-header h3{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;flex:1;}
.detail-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.detail-row span:first-child{color:var(--fg3);font-weight:500;}
.detail-row span:last-child{color:var(--fg);text-align:right;}
.detail-notes{margin-top:16px;padding:14px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;font-size:13px;}
.detail-notes p{color:var(--fg2);margin-top:6px;line-height:1.6;}
.detail-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;}
.btn-primary{background:var(--accent);color:#000;font-family:'Inter',sans-serif;font-weight:700;padding:11px 20px;border-radius:8px;border:none;cursor:pointer;text-decoration:none;font-size:14px;display:inline-block;transition:background .15s;}
.btn-primary:hover{background:var(--accent2);}
.btn-secondary{background:transparent;color:var(--fg);font-family:'Inter',sans-serif;font-weight:500;padding:11px 20px;border-radius:8px;border:1px solid var(--border2);cursor:pointer;text-decoration:none;font-size:14px;display:inline-block;transition:border-color .15s;}
.btn-secondary:hover{border-color:var(--fg3);}
/* view-site link */
.view-site-link{font-size:13px;color:var(--accent);text-decoration:none;padding:7px 14px;border:1px solid var(--accent-bord);border-radius:6px;transition:background .15s;}
.view-site-link:hover{background:var(--accent-dim);}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="adminLogin">
  <div class="login-box">
    <div class="login-logo">STRATA<span> TECH</span></div>
    <div class="login-sub">Admin dashboard &mdash; authorised access only</div>
    <form id="adminLoginForm">
      <label for="adminPw">Password</label>
      <input type="password" id="adminPw" placeholder="Enter admin password" autocomplete="current-password">
      <button type="submit" class="login-btn">Sign in</button>
      <div class="login-error" id="loginError" hidden>Incorrect password.</div>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="adminDashboard">
  <nav class="admin-nav">
    <div class="admin-logo">STRATA<span> TECH</span> <small>Admin</small></div>
    <div class="admin-nav-actions">
      <a href="../index.html" target="_blank" class="view-site-link">View site &rarr;</a>
      <button class="btn-sm" onclick="STRATA_ADMIN.reload()">&#8635; Refresh</button>
      <button class="btn-sm" id="logoutBtn">Sign out</button>
    </div>
  </nav>

  <div class="admin-body">
    <div id="demoNotice" hidden>
      &#9888; <strong>Demo mode</strong> &mdash; Supabase is not yet connected. Showing sample data. Set <code>SUPABASE_ENABLED: true</code> in <code>js/config.js</code> once your project is set up.
    </div>

    <div id="adminStats"></div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="new">New</button>
      <button class="filter-btn" data-filter="contacted">Contacted</button>
      <button class="filter-btn" data-filter="proposal_sent">Proposal Sent</button>
      <button class="filter-btn" data-filter="in_progress">In Progress</button>
      <button class="filter-btn" data-filter="won">Won</button>
      <button class="filter-btn" data-filter="lost">Lost</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Service</th>
            <th>Status</th>
            <th>Update</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="enquiriesBody">
          <tr><td colspan="7" class="loading-row">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal" hidden onclick="if(event.target===this)this.hidden=true">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('detailModal').hidden=true">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
